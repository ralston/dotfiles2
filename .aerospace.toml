# Reference: https://github.com/i3/i3/blob/next/etc/config
# Empty change

enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = false

accordion-padding = 0

[mode.main.binding]
alt-shift-enter = 'exec-and-forget open -n /Applications/iTerm.app'
alt-shift-g = 'exec-and-forget ~/scripts/remove-ghost-windows.sh'

alt-j = 'focus left'
alt-k = 'focus down'
alt-l = 'focus up'
alt-semicolon = 'focus right'

alt-shift-l = 'move up'
alt-shift-j = 'move left'
alt-shift-cmd-j = 'join-with left'
alt-shift-k = 'move down'
alt-shift-cmd-k = 'join-with down'
alt-shift-cmd-l = 'join-with up'
alt-shift-semicolon = 'move right'
alt-shift-cmd-semicolon = 'join-with right'

alt-shift-q = 'close'

alt-h = 'split horizontal'
alt-v = 'split vertical'

alt-f = 'fullscreen'
ctrl-f = 'fullscreen'

alt-s = 'layout v_accordion'               # 'layout stacking' in i3
alt-w = 'layout h_accordion'               # 'layout tabbed' in i3
alt-e = 'layout tiles horizontal vertical' # 'layout toggle split' in i3a

alt-shift-space = 'layout floating tiling'    # 'floating toggle' in i3
alt-shift-r = 'flatten-workspace-tree'
alt-shift-z = 'close-all-windows-but-current'

# Not supported, because this command is redundant in AeroSpace mental model.
# See: https://nikitabobko.github.io/AeroSpace/guide#floating-windows
#alt-space = 'focus toggle_tiling_floating'

# `focus parent`/`focus child` are not yet supported, and it's not clear whether they
# should be supported at all https://github.com/nikitabobko/AeroSpace/issues/5
# alt-a = 'focus parent'

# workspace_name_0 = 'coding'

# alt-tab = 'workspace-back-and-forth'
alt-tab = 'workspace-cycle-recent next'
alt-shift-tab = 'workspace-cycle-recent prev'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'
alt-0 = 'workspace 10'

ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'
ctrl-3 = 'workspace 3'
ctrl-4 = 'workspace 4'
ctrl-5 = 'workspace 5'
ctrl-6 = 'workspace 6'
ctrl-7 = 'workspace 7'
ctrl-8 = 'workspace 8'
ctrl-9 = 'workspace 9'
ctrl-0 = 'workspace 10'

# alt-space-1 = 'workspace 11'
# alt-space-2 = 'workspace 12'
# alt-space-3 = 'workspace 13'

# alt-shift-space-1 = 'move-node-to-workspace 11'
# alt-shift-space-2 = 'move-node-to-workspace 12'
# alt-shift-space-3 = 'move-node-to-workspace 13'

alt-shift-1 = 'move-node-to-workspace 1'
alt-shift-2 = 'move-node-to-workspace 2'
alt-shift-3 = 'move-node-to-workspace 3'
alt-shift-4 = 'move-node-to-workspace 4'
alt-shift-5 = 'move-node-to-workspace 5'
alt-shift-6 = 'move-node-to-workspace 6'
alt-shift-7 = 'move-node-to-workspace 7'
alt-shift-8 = 'move-node-to-workspace 8'
alt-shift-9 = 'move-node-to-workspace 9'
alt-shift-0 = 'move-node-to-workspace 10'

alt-shift-m = '''exec-and-forget /Users/ralston/bin/aerospace list-monitors --format "%{monitor-id} %{monitor-name}" | grep -v "^$(/Users/ralston/bin/aerospace list-monitors --focused --format '%{monitor-id}') " | choose | cut -d' ' -f1 | while read id; do /Users/ralston/bin/aerospace move-workspace-to-monitor "$id"; done'''
alt-shift-cmd-m = '''exec-and-forget /Users/ralston/bin/aerospace list-monitors --format "%{monitor-id} %{monitor-name}" | grep -v "^$(/Users/ralston/bin/aerospace list-monitors --focused --format '%{monitor-id}') " | choose | cut -d' ' -f1 | while read id; do /Users/ralston/bin/aerospace move-node-to-monitor "$id"; done'''

alt-shift-period = 'move-workspace-to-monitor --wrap-around next'
alt-shift-comma = 'move-workspace-to-monitor --wrap-around prev'
alt-shift-cmd-period = 'move-node-to-monitor --wrap-around next'
alt-shift-cmd-comma = 'move-node-to-monitor --wrap-around prev'

# alt-shift-cmd-1 = 'move-workspace-to-display 1'
# alt-shift-cmd-2 = 'move-workspace-to-display 2'

alt-t = 'workspace T'
alt-shift-t = ['move-node-to-workspace T', 'layout floating']

alt-u = 'workspace U'
alt-shift-u = ['move-node-to-workspace U', 'layout floating']

alt-i = 'workspace I'
alt-shift-i = ['move-node-to-workspace I', 'layout floating']

alt-o = 'workspace O'
alt-shift-o = ['move-node-to-workspace O', 'layout floating']

alt-p = 'workspace P'
alt-shift-p = ['move-node-to-workspace P', 'layout floating']

alt-n = 'exec-and-forget /Users/ralston/bin/aerospace list-workspaces --all | choose -m | xargs /Users/ralston/bin/aerospace workspace'
alt-shift-n = 'exec-and-forget /Users/ralston/bin/aerospace list-workspaces --all | choose -m | xargs /Users/ralston/bin/aerospace move-node-to-workspace'

alt-shift-c = 'reload-config'

[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']

[[on-window-detected]]
if.app-name-regex-substring = 'Finder'
run = ['layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Google Chrome'
if.window-title-regex-substring = 'Bitwarden'
run = ['layout floating']

[[on-window-detected]]
if.app-name-regex-substring = 'Google Chrome for Testing'
run = [
  'move-node-to-workspace T',
  'layout floating',
  'workspace-back-and-forth',
]

[workspace-to-monitor-force-assignment]
# Monitors: DELL U2725QE, Studio Display (1), Studio Display (2)
1 = 'Studio Display (2)'
9 = 'Studio Display (2)'
10 = 'Studio Display (1)'
